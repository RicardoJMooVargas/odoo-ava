[options]
admin_passwd = change-me-in-production
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True

; Restringe Odoo a una sola base de datos.
; Cambia "odoo" por el nombre real de tu DB si es diferente.
db_name = odoo
dbfilter = ^odoo$

; Conexión a la base de datos externa
; Estas variables se leen tanto al arrancar el servidor
; como al ejecutar comandos manuales dentro del container.
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}

; Deshabilita el listado de DBs para que el cron no haga polling
; en otras bases de datos del mismo servidor PostgreSQL.
list_db = False
