# docker-compose.local.yml
# Uso: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Agrega el servicio db local para desarrollo sin DB externa

services:

  odoo:
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db

  db:
    image: postgres:17-alpine
    container_name: odoo_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - odoo-net

networks:
  dokploy-network:
    name: odoo-dokploy-local
    driver: bridge

volumes:
  postgres-data: