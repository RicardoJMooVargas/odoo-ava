services:

  odoo:
    build: .
    pull_policy: build
    container_name: odoo_app
    restart: unless-stopped

    ports:
      - "${ODOO_PORT:-8069}:8069"

    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf

    environment:
      HOST: ${DB_HOST}
      PORT: ${DB_PORT:-5432}
      USER: ${DB_USER}
      PASSWORD: ${DB_PASSWORD}
      FORCE_REDEPLOY: "1"

    # develop: --dev=all activa recarga automática y debug
    # production: vacío para máximo rendimiento
    command: -u expediente_empleados ${ODOO_EXTRA_ARGS:---dev=all}

    networks:
      - odoo-net
      - dokploy-network

volumes:
  odoo-data:

networks:
  odoo-net:
    driver: bridge

  # Red externa de Traefik/Dokploy
  # En local crear una vez: docker network create dokploy-network
  dokploy-network:
    external: true
